<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>发布工作台</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="titlebar"><h1>发布工作台 <small>0.7.10</small></h1><div><button id="settings-open" class="quiet">批次设置</button><button id="expand" class="quiet">独立窗口 ↗</button></div></div><div id="selected-title">请选择内容</div><div class="actions"><button id="open" disabled>加载到视频号</button><button id="confirm-next" class="secondary">核对完成，下一条 →</button></div><div class="progress-row"><span id="progress"></span><button id="undo" class="quiet" hidden>撤销刚才核对</button></div><p id="status" role="status"></p></header>
<main><aside><label for="batch">发布批次</label><select id="batch"></select><div class="search-row"><input id="search" placeholder="搜索序号或标题"><select id="filter" aria-label="发布状态"><option value="pending">待发布</option><option value="all">全部</option></select></div><div id="cards" class="cards"></div></aside><article><div id="preview" class="preview"><p>选择左侧内容，立即查看视频、封面和文案。</p></div></article></main>
<select id="tasks" hidden></select><dialog id="settings"><h2>当前批次设置</h2><label>合集<select id="collection"><option value="">沿用内容合集</option><option>企业AI</option><option>AI创造力</option><option>AI与组织</option></select></label><label>本批起始时间<input id="start" type="datetime-local"></label><p>按本批发布序号，每小时一条。留空则沿用内容时间。</p><button id="reconnect" class="secondary">重新读取分发台内容</button><button id="settings-close">完成</button></dialog><script src="popup.js"></script></body></html>
