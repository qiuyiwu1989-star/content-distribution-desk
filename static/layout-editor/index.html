<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>片序 · 模板编辑器</title><link rel="stylesheet" href="editor.css"><header><a href="/#creative-templates">← 内容模板</a><input id="name" title="点击修改模板名称" maxlength="120" aria-label="模板名称" value="新模板"><span id="status" role="status">正在加载</span><button id="undo">撤销</button><button id="redo">重做</button><button id="save" class="primary">保存模板</button><button id="copy">另存副本</button></header><div class="workspace"><aside><h2>图层</h2><div class="add"><button data-add="text">＋文字</button><button data-add="subtitle">＋字幕</button></div><label>加载 Logo / 图片<select id="assets"><option value="">从素材库选择…</option></select></label><div id="layers"></div><hr><label>打开已保存模板<select id="saved"><option value="">选择模板…</option></select></label><details><summary>导出与 Codex</summary><p>手动与 Codex 共用同一份模板数据。</p><button id="json">导出 JSON</button><label>导入 JSON<input id="import" type="file" accept=".json"></label><button id="svg">导出 SVG</button><a href="agent.md" target="_blank">Codex 调用说明</a><p id="document-id"></p></details></aside><main><div class="canvas-caption">1080 × 1920 · 原始像素坐标 · 拖动调整位置</div><div id="stage"></div><p class="hint">方向键移动 1 px · Shift 移动 10 px · Delete 删除（可撤销）<br>⌘ / Ctrl + Z 撤销 · Shift + Z 重做 · S 保存 · D 复制图层</p></main><aside id="properties"><h2>图层属性</h2><p>选择画布上的元素或左侧图层。</p></aside></div><script src="editor.js"></script></html>
